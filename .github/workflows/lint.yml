name: Lint & Validate Configs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check YAML Syntax
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .
          config_file: .yamllint.yml

      - name: Validate Prometheus Config (Promtool)
        uses: docker://prom/prometheus:v2.51.0
        with:
          args: check config /github/workspace/prometheus/prometheus.yml
